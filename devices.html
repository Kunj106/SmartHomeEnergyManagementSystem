<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Devices - Smart Energy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="navbar">
  <div class="nav-container">
    <a href="homeowner.html" class="logo">
      <div class="logo-icon">⚡</div>
      <span>SMART ENERGY</span>
    </a>
    <ul class="nav-menu"></ul>
  </div>
</nav>

<section class="section">
  <div class="container">
    <h1 class="fade-in"> MY DEVICES</h1>
    <p class="text-muted" style="margin-bottom: 3rem;">Manage all your smart energy devices</p>

    <!-- Device Statistics -->
    <div class="grid grid-4" style="margin-bottom: 3rem;">
      <div class="stat-card">
        <div class="stat-value" id="totalDevices">7</div>
        <div class="stat-label">TOTAL DEVICES</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="activeDevices">5</div>
        <div class="stat-label">ACTIVE</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalPower">388kW</div>
        <div class="stat-label">TOTAL POWER</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="monthlyUsage">9312 kWh</div>
        <div class="stat-label">MONTHLY USAGE</div>
      </div>
    </div>

    <!-- Filter and Add Device -->
    <div class="card" style="margin-bottom: 2rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <select id="filterType" style="padding: 0.75rem; background: rgba(31, 41, 55, 0.5); border: 2px solid rgba(0, 240, 255, 0.3); border-radius: 12px; color: var(--text-primary);">
            <option value="all">All Types</option>
            <option value="Air Conditioner">Air Conditioner</option>
            <option value="Refrigerator">Refrigerator</option>
            <option value="Water Heater">Water Heater</option>
            <option value="Washing Machine">Washing Machine</option>
            <option value="Television">Television</option>
            <option value="Microwave">Microwave</option>
            <option value="Other">Other</option>
          </select>
          <select id="filterStatus" style="padding: 0.75rem; background: rgba(31, 41, 55, 0.5); border: 2px solid rgba(0, 240, 255, 0.3); border-radius: 12px; color: var(--text-primary);">
            <option value="all">All Status</option>
            <option value="online">Online</option>
            <option value="offline">Offline</option>
            <option value="standby">Standby</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="showAddDeviceModal()">
          <span style="font-size: 1.2rem;">+</span> ADD DEVICE
        </button>
      </div>
    </div>

    <!-- Devices Grid -->
    <div id="devicesGrid" class="grid grid-3"></div>
  </div>
</section>

<!-- Add/Edit Device Modal -->
<div id="deviceModal" class="modal" style="display: none;">
  <div class="modal-content card" style="max-width: 700px; margin: 3% auto; max-height: 90vh; overflow-y: auto;">
    <h2 id="modalTitle">ADD DEVICE</h2>
    <form id="deviceForm">
      <div class="grid grid-2">
        <div class="form-group">
          <label for="deviceName">DEVICE NAME *</label>
          <input type="text" id="deviceName" required placeholder="e.g., Living Room AC">
        </div>
        <div class="form-group">
          <label for="deviceType">TYPE *</label>
          <select id="deviceType" required>
            <option value="">Select Type</option>
            <option value="Air Conditioner">Air Conditioner</option>
            <option value="Refrigerator">Refrigerator</option>
            <option value="Water Heater">Water Heater</option>
            <option value="Washing Machine">Washing Machine</option>
            <option value="Television">Television</option>
            <option value="Microwave">Microwave</option>
            <option value="Dishwasher">Dishwasher</option>
            <option value="Oven">Oven</option>
            <option value="Dryer">Dryer</option>
            <option value="Fan">Fan</option>
            <option value="Heater">Heater</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="grid grid-2">
        <div class="form-group">
          <label for="deviceBrand">BRAND *</label>
          <input type="text" id="deviceBrand" required placeholder="e.g., LG, Samsung">
        </div>
        <div class="form-group">
          <label for="deviceModel">MODEL *</label>
          <input type="text" id="deviceModel" required placeholder="e.g., AC-2000">
        </div>
      </div>

      <div class="grid grid-2">
        <div class="form-group">
          <label for="powerRating">POWER RATING (WATTS) *</label>
          <input type="number" id="powerRating" required step="0.01" placeholder="e.g., 2500">
        </div>
        <div class="form-group">
          <label for="voltageRating">VOLTAGE (VOLTS)</label>
          <input type="number" id="voltageRating" step="0.01" placeholder="e.g., 220">
        </div>
      </div>

      <div class="grid grid-2">
        <div class="form-group">
          <label for="energyStar">ENERGY STAR RATING</label>
          <select id="energyStar">
            <option value="">Not Rated</option>
            <option value="1">⭐ 1 Star</option>
            <option value="2">⭐⭐ 2 Stars</option>
            <option value="3">⭐⭐⭐ 3 Stars</option>
            <option value="4">⭐⭐⭐⭐ 4 Stars</option>
            <option value="5">⭐⭐⭐⭐⭐ 5 Stars</option>
          </select>
        </div>
        <div class="form-group">
          <label for="deviceLocation">LOCATION</label>
          <input type="text" id="deviceLocation" placeholder="e.g., Living Room, Kitchen">
        </div>
      </div>

      <div class="form-group">
        <label for="deviceNotes">NOTES (OPTIONAL)</label>
        <textarea id="deviceNotes" rows="3" placeholder="Additional information about the device" style="width: 100%; padding: var(--space-sm) var(--space-md); background: rgba(31, 41, 55, 0.5); border: 2px solid rgba(0, 240, 255, 0.3); border-radius: 12px; color: var(--text-primary); font-family: var(--font-body); resize: vertical;"></textarea>
      </div>

      <div style="display: flex; gap: 1rem; margin-top: 2rem;">
        <button type="submit" class="btn btn-primary" style="flex: 1;">
          SAVE DEVICE
        </button>
        <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeDeviceModal()">
          ✖ CANCEL
        </button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
<script>
  if (!AuthManager.isAuthenticated()) {
      window.location.href = 'login.html';
  }

  let currentEditingDeviceId = null;
  let allDevices = [];

  // Load devices
  async function loadDevices() {
      try {
          allDevices = await DeviceManager.loadDevices();
          updateStatistics();
          filterAndDisplayDevices();
      } catch (error) {
          console.error('Error loading devices:', error);
      }
  }

  // Update statistics
  function updateStatistics() {
      const total = allDevices.length;
      const active = allDevices.filter(d => d.isActive && d.status === 'online').length;
      const totalPower = allDevices.reduce((sum, d) => sum + (d.powerRating || 0), 0);

      document.getElementById('totalDevices').textContent = total;
      document.getElementById('activeDevices').textContent = active;
      document.getElementById('totalPower').textContent = Math.round(totalPower) + 'W';
  }

  // Filter and display devices
  function filterAndDisplayDevices() {
      const typeFilter = document.getElementById('filterType').value;
      const statusFilter = document.getElementById('filterStatus').value;

      let filtered = allDevices;

      if (typeFilter !== 'all') {
          filtered = filtered.filter(d => d.type === typeFilter);
      }

      if (statusFilter !== 'all') {
          filtered = filtered.filter(d => d.status === statusFilter);
      }

      displayDevices(filtered);
  }

  // Display devices
  function displayDevices(devices) {
      const grid = document.getElementById('devicesGrid');

      if (devices.length === 0) {
          grid.innerHTML = `
              <div class="card" style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
                  <h3 style="color: var(--text-muted); margin-bottom: 1rem;">No devices found</h3>
                  <p style="color: var(--text-muted);">Click "ADD DEVICE" to get started</p>
              </div>
          `;
          return;
      }

      grid.innerHTML = devices.map(device => {
          const statusColor = device.status === 'online' ? '#00ff88' :
                             device.status === 'offline' ? '#ff3366' : '#FFD700';
          const statusIcon = device.status === 'online' ? '●' :
                            device.status === 'offline' ? '○' : '◐';

          const stars = device.energyStarRating ? '⭐'.repeat(device.energyStarRating) : '';

          return `
              <div class="card device-card" data-device-id="${device.id}">
                  <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem;">
                      <h4 style="font-family: var(--font-display); flex: 1; margin-right: 1rem;">${device.name}</h4>
                      <div style="display: flex; gap: 0.5rem;">
                          <button class="btn-icon" onclick="editDevice(${device.id})" title="Edit">
                              ✏️
                          </button>
                          <button class="btn-icon" onclick="deleteDeviceConfirm(${device.id})" title="Delete">

                          </button>
                      </div>
                  </div>

                  <div style="margin-bottom: 1rem;">
                      <p style="color: ${statusColor}; margin: 0.5rem 0; font-weight: 600; font-size: 0.9rem;">
                          ${statusIcon} ${device.status.toUpperCase()}
                      </p>
                      <p class="text-muted" style="margin: 0.5rem 0; font-size: 0.9rem;">
                           ${device.type}
                      </p>
                      <p class="text-muted" style="margin: 0.5rem 0; font-size: 0.9rem;">
                           ${device.brand} ${device.model}
                      </p>
                      <p class="text-muted" style="margin: 0.5rem 0; font-size: 0.9rem;">
                           ${device.powerRating}W
                      </p>
                      ${device.location ? `<p class="text-muted" style="margin: 0.5rem 0; font-size: 0.9rem;">📍 ${device.location}</p>` : ''}
                      ${stars ? `<p style="margin: 0.5rem 0; font-size: 0.9rem;">${stars}</p>` : ''}
                  </div>

                  <button class="btn ${device.status === 'online' ? 'btn-secondary' : 'btn-primary'}"
                          style="width: 100%;"
                          onclick="toggleDevice(${device.id}, '${device.status}')">
                      ${device.status === 'online' ? '⏸ TURN OFF' : '▶ TURN ON'}
                  </button>
              </div>
          `;
      }).join('');
  }

  // Show add device modal
  function showAddDeviceModal() {
      currentEditingDeviceId = null;
      document.getElementById('modalTitle').textContent = 'ADD NEW DEVICE';
      document.getElementById('deviceForm').reset();
      document.getElementById('deviceModal').style.display = 'block';
  }

  // Edit device
  async function editDevice(deviceId) {
      try {
          const device = await APIService.getDeviceById(deviceId);
          currentEditingDeviceId = deviceId;

          document.getElementById('modalTitle').textContent = 'EDIT DEVICE';
          document.getElementById('deviceName').value = device.name;
          document.getElementById('deviceType').value = device.type;
          document.getElementById('deviceBrand').value = device.brand;
          document.getElementById('deviceModel').value = device.model;
          document.getElementById('powerRating').value = device.powerRating;
          document.getElementById('voltageRating').value = device.voltageRating || '';
          document.getElementById('energyStar').value = device.energyStarRating || '';
          document.getElementById('deviceLocation').value = device.location || '';
          document.getElementById('deviceNotes').value = device.notes || '';

          document.getElementById('deviceModal').style.display = 'block';
      } catch (error) {
          alert('Failed to load device details');
      }
  }

  // Close modal
  function closeDeviceModal() {
      document.getElementById('deviceModal').style.display = 'none';
      currentEditingDeviceId = null;
  }

  // Handle device form submission
  document.getElementById('deviceForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading"></span> SAVING...';

      const deviceData = {
          name: document.getElementById('deviceName').value,
          type: document.getElementById('deviceType').value,
          brand: document.getElementById('deviceBrand').value,
          model: document.getElementById('deviceModel').value,
          powerRating: parseFloat(document.getElementById('powerRating').value),
          voltageRating: parseFloat(document.getElementById('voltageRating').value) || null,
          energyStarRating: parseInt(document.getElementById('energyStar').value) || null,
          location: document.getElementById('deviceLocation').value,
          notes: document.getElementById('deviceNotes').value,
          status: 'offline',
          isActive: true
      };

      try {
          if (currentEditingDeviceId) {
              await DeviceManager.updateDevice(currentEditingDeviceId, deviceData);
          } else {
              await DeviceManager.createDevice(deviceData);
          }

          closeDeviceModal();
          await loadDevices();
      } catch (error) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
      }
  });

  // Toggle device status
  async function toggleDevice(deviceId, currentStatus) {
      try {
          await DeviceManager.toggleDeviceStatus(deviceId, currentStatus);
          await loadDevices();
      } catch (error) {
          console.error('Error toggling device:', error);
      }
  }

  // Delete device
  async function deleteDeviceConfirm(deviceId) {
      if (confirm('Are you sure you want to delete this device? This action cannot be undone.')) {
          try {
              await DeviceManager.deleteDevice(deviceId);
              await loadDevices();
          } catch (error) {
              console.error('Error deleting device:', error);
          }
      }
  }

  // Filter change handlers
  document.getElementById('filterType').addEventListener('change', filterAndDisplayDevices);
  document.getElementById('filterStatus').addEventListener('change', filterAndDisplayDevices);

  // Close modal when clicking outside
  window.onclick = function(event) {
      const modal = document.getElementById('deviceModal');
      if (event.target === modal) {
          closeDeviceModal();
      }
  }

  // Load devices on page load
  loadDevices();

  // Also load monthly usage
  async function loadMonthlyUsage() {
      try {
          const summary = await APIService.getConsumptionSummary();
          document.getElementById('monthlyUsage').textContent = (summary.totalEnergy || 0).toFixed(2) + ' kWh';
      } catch (error) {
          console.error('Error loading monthly usage:', error);
      }
  }
  loadMonthlyUsage();
</script>

<style>
  .modal {
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      animation: fadeIn 0.3s ease;
  }

  .modal-content {
      animation: slideUp 0.4s ease;
  }

  .btn-icon {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.2s ease;
      padding: 0.25rem;
  }

  .btn-icon:hover {
      transform: scale(1.2);
  }

  .device-card {
      transition: all 0.3s ease;
  }

  .device-card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 10px 40px rgba(0, 240, 255, 0.3);
  }

  .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.6s linear infinite;
  }

  @keyframes spin {
      to { transform: rotate(360deg); }
  }
</style>
</body>
</html>
