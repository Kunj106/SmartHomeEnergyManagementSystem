spring.application.name=SmartHomeEnergyManagementSystem

server.port=${PORT:9091}

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.TiDBDialect

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# IoT Simulation Settings
iot.simulation.enabled=true
iot.simulation.interval=30000
iot.simulation.retention-days=30

# Scheduler Settings
spring.task.scheduling.enabled=true
spring.task.scheduling.pool.size=5

# Real-time settings
realtime.chart.max-points=50
realtime.refresh-interval=30
realtime.alert.threshold-percent=110
realtime.alert.critical-threshold-percent=120

spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

logging.level.org.springframework.security=DEBUG

